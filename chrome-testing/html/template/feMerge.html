<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>&lt;feMerge&gt;</title>
<style>
  body{margin:0;background:#1a1a2e;color:#e6e6e6;font:14px/1.4 ui-monospace,Menlo,monospace;padding:24px}
  h1{color:#16c79a;font-size:18px;margin:0 0 4px}
  p.desc{color:#9aa;margin:0 0 20px}
  .grid{display:flex;flex-wrap:wrap;gap:16px}
  .card{background:#0f1530;border:1px solid #26305a;border-radius:8px;padding:10px;width:160px}
  .card svg{display:block;background:#161c3a;border-radius:4px;width:140px;height:140px}
  .card .label{margin-top:8px;color:#f5a623;font-size:12px;word-break:break-all}
</style></head>
<body>
  <h1>&lt;feMerge&gt;</h1>
  <p class="desc">Composites multiple named layers using "over", bottom to top. Each feMergeNode references a result by name.</p>
  <div class="grid">

    <!-- 1. Merge 2 layers: flood + source -->
    <div class="card">
      <svg viewBox="0 0 100 100">
        <defs>
          <filter id="fm-2layer">
            <feFlood flood-color="#e94560" x="0" y="0" width="60%" height="60%" result="red"/>
            <feMerge>
              <feMergeNode in="SourceGraphic"/>
              <feMergeNode in="red"/>
            </feMerge>
          </filter>
        </defs>
        <rect x="5" y="5" width="90" height="90" fill="#4d8bff" filter="url(#fm-2layer)"/>
      </svg>
      <div class="label">2 nodes<br>source + flood</div>
    </div>

    <!-- 2. Merge 3 layers: blue rect, green circle, orange offset -->
    <div class="card">
      <svg viewBox="0 0 100 100">
        <defs>
          <filter id="fm-3layer">
            <feFlood flood-color="#4d8bff" x="5%" y="5%" width="50%" height="50%" result="a"/>
            <feFlood flood-color="#16c79a" x="25%" y="25%" width="50%" height="50%" result="b"/>
            <feFlood flood-color="#ffd166" x="45%" y="45%" width="50%" height="50%" result="c"/>
            <feMerge>
              <feMergeNode in="a"/>
              <feMergeNode in="b"/>
              <feMergeNode in="c"/>
            </feMerge>
          </filter>
        </defs>
        <rect x="5" y="5" width="90" height="90" fill="none" filter="url(#fm-3layer)"/>
      </svg>
      <div class="label">3 nodes<br>stacked floods</div>
    </div>

    <!-- 3. Source graphic merged under a partial flood overlay -->
    <div class="card">
      <svg viewBox="0 0 100 100">
        <defs>
          <filter id="fm-overlay">
            <feFlood flood-color="#b06aff" flood-opacity="0.6" x="20%" y="20%" width="60%" height="60%" result="overlay"/>
            <feMerge>
              <feMergeNode in="SourceGraphic"/>
              <feMergeNode in="overlay"/>
            </feMerge>
          </filter>
        </defs>
        <rect x="5" y="5" width="90" height="90" fill="#f5a623" filter="url(#fm-overlay)"/>
      </svg>
      <div class="label">source + semi-<br>transparent overlay</div>
    </div>

    <!-- 4. Shadow merge: drop-shadow layer merged with source -->
    <div class="card">
      <svg viewBox="0 0 100 100">
        <defs>
          <filter id="fm-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feFlood flood-color="#000" flood-opacity="0.5" result="shadowColor"/>
            <feComposite in="shadowColor" in2="SourceAlpha" operator="in" result="shadow"/>
            <feOffset in="shadow" dx="6" dy="6" result="shiftedShadow"/>
            <feMerge>
              <feMergeNode in="shiftedShadow"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect x="10" y="10" width="70" height="70" fill="#e94560" filter="url(#fm-shadow)"/>
      </svg>
      <div class="label">manual drop-shadow<br>via feMerge</div>
    </div>

    <!-- 5. Four layers diagonal staircase -->
    <div class="card">
      <svg viewBox="0 0 100 100">
        <defs>
          <filter id="fm-stair">
            <feFlood flood-color="#e94560" x="0" y="0" width="40%" height="40%" result="q1"/>
            <feFlood flood-color="#16c79a" x="25%" y="25%" width="40%" height="40%" result="q2"/>
            <feFlood flood-color="#4d8bff" x="50%" y="50%" width="40%" height="40%" result="q3"/>
            <feFlood flood-color="#ffd166" x="60%" y="5%" width="35%" height="35%" result="q4"/>
            <feMerge>
              <feMergeNode in="q1"/>
              <feMergeNode in="q2"/>
              <feMergeNode in="q3"/>
              <feMergeNode in="q4"/>
            </feMerge>
          </filter>
        </defs>
        <rect x="0" y="0" width="100" height="100" fill="none" filter="url(#fm-stair)"/>
      </svg>
      <div class="label">4 nodes diagonal<br>staircase</div>
    </div>

  </div>

  <!-- machine blueprint -->
  <script type="application/svg-blueprint" id="blueprint">
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 100 100">
  <defs>
    <filter id="slot">
      <feFlood flood-color="#e94560" x="0" y="0" width="60%" height="60%" result="layerA"/>
      <feFlood flood-color="#4d8bff" x="40%" y="40%" width="60%" height="60%" result="layerB"/>
      {{ELEMENT}}
    </filter>
  </defs>
  <rect x="5" y="5" width="90" height="90" fill="#f5a623" filter="url(#slot)"/>
</svg>
  </script>
</body></html>
